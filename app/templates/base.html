<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ZeroTab{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a href="/ui">ZeroTab</a>
    <span class="tagline">Settle shared expenses with the fewest transfers</span>
  </header>
  <main class="container">
    {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
