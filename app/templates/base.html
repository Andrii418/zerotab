<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ZeroTab{% endblock %}</title>
  <link rel="icon" href="data:,">
  <script>
    document.documentElement.classList.add("js");
    try {
      var storedTheme = localStorage.getItem("zerotab-theme");
      document.documentElement.dataset.theme = storedTheme || "light";
      var storedLang = localStorage.getItem("zerotab-lang");
      document.documentElement.lang = storedLang === "en" ? "en" : "pl";
    } catch (error) { }
  </script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/ui">
      <span class="brand-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16"/><path d="M12 4v16" opacity=".45"/><circle cx="12" cy="12" r="8"/></svg>
      </span>
      ZeroTab
    </a>
    <span class="tagline" data-i18n="tagline">Rozliczaj wspólne wydatki jak najmniejszą liczbą przelewów</span>

    <div class="topbar-controls">
      <button class="switch" id="lang-toggle" type="button" role="switch" aria-checked="false" aria-label="Język" data-i18n-aria="aria.lang">
        <span class="switch-thumb"></span>
        <span class="switch-opt">PL</span>
        <span class="switch-opt">EN</span>
      </button>
      <button class="switch" id="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Motyw" data-i18n-aria="aria.theme">
        <span class="switch-thumb"></span>
        <span class="switch-opt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span>
        <span class="switch-opt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
      </button>
    </div>
  </header>
  <main class="container">
    {% if error %}
    <div class="alert" role="alert">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
      <span>{{ error }}</span>
      <button class="alert-close" type="button" aria-label="Dismiss">&times;</button>
    </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <script src="/static/i18n.js"></script>
  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
